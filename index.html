<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SABIMEDIC JESUS | Menu Principal</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #475569;
        line-height: 1.6;
        overflow-x: hidden;
      }

      .main-container {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(12px, 2vw, 24px);
        max-width: 100%;
      }

      .header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 2px solid #e2e8f0;
        margin-bottom: 30px;
        position: relative;
        z-index: 20;
      }

      .menu-toggle {
        display: none;
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        background: #ffffff;
        color: #1e3a8a;
        cursor: pointer;
        width: 48px;
        height: 44px;
        font-size: 1.4rem;
        line-height: 1;
      }

      .foto-izquierda {
        width: 230px;
        height: 205px;
        background: #e2e8f0;
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #475569;
        font-size: 0.75rem;
        text-align: center;
        padding: 3px;
      }

      .foto-derecha {
        width: 230px;
        height: 205px;
        background: #e2e8f0;
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #475569;
        font-size: 0.75rem;
        text-align: center;
        padding: 3px;
      }

      .nav-header {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .nav-header.is-open {
        display: flex;
      }

      .nav-header a {
        text-decoration: none;
        color: #1e3a8a;
        font-weight: bold;
        padding: 8px 15px;
        border-bottom: 2px solid transparent;
        transition: all 0.3s;
        font-size: 1.5rem;
      }

      .nav-header a:hover {
        border-bottom-color: #06b6d4;
      }

      .seccion-central {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 30px;
        padding: 20px;
      }

      .titulo-principal {
        text-align: center;
        color: #1e3a8a;
        line-height: 0.92;
        max-width: 950px;
        position: relative;
        padding: 10px 18px 22px;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
      }

      .titulo-principal::after {
        content: "";
        display: block;
        width: min(520px, 72vw);
        height: 6px;
        margin: 18px auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      }

      .titulo-principal h1 {
        font-size: 3.5rem;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0;
        letter-spacing: 0;
      }

      .titulo-principal .consultorio {
        font-size: clamp(2.5rem, 5vw, 4.8rem);
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .titulo-principal .medico {
        font-size: clamp(2.5rem, 5vw, 4.8rem);
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .botones-menu {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
        max-width: 900px;
      }

      .boton-menu {
        padding: 14px 25px;
        background: #ffffff;
        color: #1e3a8a;
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.95rem;
        min-width: 160px;
        text-align: center;
        transition: all 0.3s;
        box-shadow: 4px 4px 0 rgba(6, 182, 212, 0.2);
      }

      .boton-menu:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 rgba(6, 182, 212, 0.3);
        background: #f8fafc;
      }

      .boton-reservar {
        background: #06b6d4;
        color: #ffffff;
        border-color: #06b6d4;
      }

      .boton-reservar:hover {
        background: #0891b2;
        box-shadow: 6px 6px 0 rgba(6, 182, 212, 0.4);
      }

      .boton-emergencia {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fca5a5;
      }

      .boton-emergencia:hover {
        background: #fecaca;
      }

      .footer {
        padding: 20px 0;
        border-top: 2px solid #e2e8f0;
        margin-top: 30px;
      }

      .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .redes-sociales {
        display: flex;
        gap: 12px;
      }

      .red-social {
        width: 45px;
        height: 45px;
        border: 2px solid #1e3a8a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #1e3a8a;
        font-weight: bold;
        background: #ffffff;
        transition: all 0.3s;
      }

      .red-social:hover {
        background: #06b6d4;
        color: #ffffff;
        border-color: #06b6d4;
      }

      .info-contacto {
        text-align: right;
      }

      .info-contacto a {
        display: inline-block;
        padding: 12px 20px;
        background: #ffffff;
        color: #1e3a8a;
        border: 2px solid #1e3a8a;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: all 0.3s;
      }

      .info-contacto a:hover {
        background: #1e3a8a;
        color: #ffffff;
      }

      @media (max-width: 768px) {
        .header {
          display: flex;
          flex-wrap: wrap;
          text-align: center;
          gap: 8px;
          padding: 12px 0 18px;
          margin-bottom: 12px;
          overflow: visible;
        }

        .header > div {
          width: calc(50% - 32px);
          flex: 0 0 calc(50% - 32px);
        }

        .header > div:first-child {
          order: 1;
        }
        .header > div:last-child {
          order: 2;
        }

        .menu-toggle {
          order: 3;
          position: static;
          flex: 0 0 44px;
          width: 44px;
        }
        .nav-header {
          order: 4;
          flex: 0 0 100%;
        }

        .foto-izquierda,
        .foto-derecha {
          width: 100%;
          height: 105px;
          object-fit: cover;
        }

        .foto-derecha {
          object-fit: contain;
          background: #ffffff;
        }

        .menu-toggle {
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .nav-header {
          position: absolute;
          top: calc(100% - 2px);
          right: 0;
          z-index: 50;
          display: none;
          flex-direction: column;
          align-items: stretch;
          gap: 0;
          width: min(240px, 82vw);
          padding: 8px;
          border: 1px solid #e2e8f0;
          border-radius: 8px;
          background: #ffffff;
          box-shadow: 0 16px 30px rgba(15, 23, 42, 0.14);
        }

        .nav-header.is-open {
          display: flex;
        }

        .nav-header a {
          font-size: 0.95rem;
          padding: 12px 14px;
          text-align: left;
          border-bottom: 1px solid #e2e8f0;
        }

        .nav-header a:last-child {
          border-bottom: 0;
        }

        .titulo-principal h1 {
          font-size: clamp(2.7rem, 13vw, 4.5rem);
        }

        .titulo-principal .consultorio,
        .titulo-principal .medico {
          font-size: clamp(1.7rem, 8vw, 2.8rem);
        }

        .seccion-central {
          gap: 22px;
          padding: 16px 8px 28px;
        }

        .titulo-principal {
          width: 100%;
          padding: 8px 4px 18px;
        }

        .titulo-principal::after {
          height: 4px;
          margin-top: 14px;
        }

        .botones-menu {
          flex-direction: column;
          width: 100%;
          gap: 11px;
        }

        .boton-menu {
          width: 100%;
          min-width: 100%;
          padding: 13px 16px;
        }

        .footer-content {
          flex-direction: column;
          text-align: center;
        }

        .info-contacto {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <header class="header">
        <div>
          <img
            src="assets/img/consultorio.jpg"
            alt="Foto del consultorio"
            class="foto-izquierda"
          />
        </div>

        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          ☰
        </button>

        <nav class="nav-header" aria-label="Navegacion principal">
          <a href="nosotros.html">Nosotros</a>
          <a href="especialidades.html">Especialidades</a>
          <a href="contacto.html">Contacto</a>
        </nav>

        <div>
          <img
            src="assets/img/logo.png"
            alt="Logo de SABIMEDIC JESUS"
            class="foto-derecha"
          />
        </div>
      </header>

      <section class="seccion-central">
        <div class="titulo-principal">
          <p class="consultorio">CONSULTORIO</p>
          <p class="medico">MEDICO</p>
          <h1>SABIMEDIC</h1>
          <h1>JESUS</h1>
        </div>

        <nav class="botones-menu">
          <a href="index.html" class="boton-menu">INICIO</a>
          <a href="nosotros.html" class="boton-menu">SOBRE NOSOTROS</a>
          <a href="especialidades.html" class="boton-menu">ESPECIALIDADES</a>

          <a
            href="contacto.html?tipo=reserva#formulario"
            class="boton-menu boton-reservar"
          >
            RESERVAR CITA
          </a>
          <a href="emergencia.html" class="boton-menu boton-emergencia">EMERGENCIA</a>
        </nav>
      </section>

      <footer class="footer">
        <div class="footer-content">
          <div class="redes-sociales">
            <a
              href="https://wa.me/59172347510"
              class="red-social"
              title="WhatsApp"
              aria-label="WhatsApp"
            >
              <img src="assets/icons/whatsapp.svg" alt="" width="26" height="26" />
            </a>
            <a
              href="https://www.facebook.com/sabimedic.jesus"
              class="red-social"
              title="Facebook"
              aria-label="Facebook"
            >
              <img src="assets/icons/facebook.svg" alt="" width="26" height="26" />
            </a>
            <a href="#" class="red-social" title="TikTok" aria-label="TikTok">
              <img src="assets/icons/tiktok.svg" alt="" width="26" height="26" />
            </a>
            <a href="#" class="red-social" title="Instagram" aria-label="Instagram">
              <img src="assets/icons/instagram.svg" alt="" width="26" height="26" />
            </a>
          </div>

          <div class="info-contacto">
            <a href="contacto.html">
              <strong>Numero del Consultorio: 72347510</strong>
              <br />
              <span style="font-size: 0.9rem">Contactanos</span>
            </a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      const menuToggle = document.querySelector(".menu-toggle");

      const mobileMenu = document.querySelector(".nav-header");

      menuToggle.addEventListener("click", () => {
        const menuIsOpen = mobileMenu.classList.toggle("is-open");

        menuToggle.setAttribute("aria-expanded", String(menuIsOpen));

        menuToggle.setAttribute("aria-label", menuIsOpen ? "Cerrar menu" : "Abrir menu");

        menuToggle.textContent = menuIsOpen ? "×" : "☰";
      });

      mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.remove("is-open");

          menuToggle.setAttribute("aria-expanded", "false");

          menuToggle.setAttribute("aria-label", "Abrir menu");

          menuToggle.textContent = "☰";
        });
      });
    </script>
  </body>
</html>

<!--
  Este archivo dibuja el icono de Facebook que aparece junto a los enlaces
  de redes sociales. Puedes cambiar los colores de los atributos fill sin
  tener que tocar la forma del logo.
  El viewBox indica el espacio interno del dibujo: todos los elementos usan
  coordenadas entre 0 y 64 para conservar la misma proporcion al cambiar
  el tamano desde el HTML o desde los estilos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Facebook">
  <!-- Fondo circular suave que hace que el icono se integre con la pagina. -->
  <circle cx="32" cy="32" r="29" fill="#EFF6FF"/>
  <!-- Forma principal de la letra de Facebook, en azul institucional. -->
  <path fill="#1E3A8A" d="M36.2 54V34.5h6.5l1-7.6h-7.5V22c0-2.2.6-3.7 3.8-3.7h4v-6.8c-.7-.1-3.1-.3-5.9-.3-5.8 0-9.8 3.5-9.8 10v5.6h-6.6v7.6h6.6V54h7.9Z"/>
  <!-- Segunda capa de color. Da una pequena profundidad al simbolo. -->
  <path fill="#06B6D4" d="M44 11.5v6.8h-4c-3.2 0-3.8 1.5-3.8 3.7v4.9h7.5l-1 7.6h-6.5V54h-3.7V34.5H26v-7.6h6.5v-5.6c0-4.5 2.4-8 6.8-9.3 1.8-.5 3.8-.6 4.7-.5Z" opacity=".45"/>
</svg>
